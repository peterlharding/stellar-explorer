[project]
name = "stellar-pipeline"
version = "0.0.0"
description = "Builds the Stellar Explorer catalogue database from public star and exoplanet catalogues"
license = "MIT"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
stellar-pipeline = "stellar_pipeline.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.13",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra", "-m", "not gate"]
filterwarnings = ["error"]
markers = [
    "gate: checks the built catalogue against published values (needs `make catalogue` first)",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "PT", "C4", "PIE", "RET", "PTH", "PL"]
ignore = ["PLR2004", "PLR0913", "PLR0917"]

[tool.mypy]
strict = true
python_version = "3.13"
