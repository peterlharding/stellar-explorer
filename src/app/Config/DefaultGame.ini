[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=Stellar Explorer Unreal spike
; The release version, kept in step with VERSION by scripts/version.py: do not edit by hand.
ProjectVersion=0.5.1

[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToAlwaysCook=(Path="/Game/Generated")
; The cube and its material for the -TestObject check.
+DirectoriesToAlwaysCook=(Path="/Engine/BasicShapes")
; The catalogue travels as a plain file, copied into Content/Data by stellar.sh before packaging.
+DirectoriesToAlwaysStageAsNonUFS=(Path="Data")

[/Script/StellarExplorer.StarPointer]
; The hand that points at stars in a headset: Right or Left. -PointingHand= on the
; command line (or in uecommandline.txt on the headset) overrides it.
PointingHand=Right
; Seconds after a star is kept or let go during which pinches are ignored, so a pinch the
; tracking sees twice does not undo itself. -GestureGate= on the command line overrides it.
GestureGateSeconds=1.0
; With a star kept, two pinches this many seconds apart let it go. -DoublePinch= overrides it.
DoublePinchSeconds=1.0
; With hand tracking (the Vision Pro), whether the pointing hand casts a ray to point with and
; pinch at. Off, look at a star or a button and pinch instead. -HandRay on the command line
; turns it on. Controllers (the Vive) always have their ray.
bHandRay=False

[/Script/StellarExplorer.StarVoice]
; How voice commands are heard: PushToTalk (hold a pinch on the hand that does not point,
; a grip button, or V on the desktop), WakeWord (say it first: "Stellar, go to Sirius"),
; Both, or Off. -Voice= on the command line overrides it.
Listening=Both
WakeWord=Stellar
; Star names, the brightest and nearest in turn, the recogniser is told to expect. -VoiceHints= overrides it.
HintCount=200
; With the wake word, act once the words have not changed for this many seconds.
WakePauseSeconds=0.8
; Or once a command needing no star's name has stood this long, though other words go on.
CommandPauseSeconds=0.4

[/Script/StellarExplorer.StarActions]
; "Go to" stops this many parsecs short of the star.
ArriveParsecs=0.5
; "Back off" multiplies the distance from the star kept or pointed at by this; "closer" divides it.
DistanceFactor=3.0

[/Script/StellarExplorer.StarControl]
; The TCP port the desktop console connects to; 0 turns the control service off.
; -ControlPort= overrides it, and -NoControl turns it off.
ControlPort=47800
