[/Script/Engine.InputSettings]
; OpenXR delivers a controller's trigger value only when an input action is bound to it, and the
; keys are device-specific. The Vive Pro 2 is used with either Vive wands or Valve Index
; controllers, so both triggers are bound per hand; the pointer polls both and takes whichever is
; pressed (see StarPointer). Windows-only, so the Vision Pro build is unaffected.
+AxisMappings=(AxisName="PointerTriggerRight",Scale=1.000000,Key=Vive_Right_Trigger_Axis)
+AxisMappings=(AxisName="PointerTriggerRight",Scale=1.000000,Key=ValveIndex_Right_Trigger_Axis)
+AxisMappings=(AxisName="PointerTriggerLeft",Scale=1.000000,Key=Vive_Left_Trigger_Axis)
+AxisMappings=(AxisName="PointerTriggerLeft",Scale=1.000000,Key=ValveIndex_Left_Trigger_Axis)
