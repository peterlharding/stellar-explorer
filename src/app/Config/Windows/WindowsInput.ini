[/Script/Engine.InputSettings]
; OpenXR delivers a controller's trigger value only when an input action is bound to it, and the
; keys are device-specific. The Vive Pro 2 is used with either Vive wands or Valve Index
; controllers, so both triggers are bound per hand; the pointer polls both and takes whichever is
; pressed (see StarPointer). Windows-only, so the Vision Pro build is unaffected.
+AxisMappings=(AxisName="PointerTriggerRight",Scale=1.000000,Key=Vive_Right_Trigger_Axis)
+AxisMappings=(AxisName="PointerTriggerRight",Scale=1.000000,Key=ValveIndex_Right_Trigger_Axis)
+AxisMappings=(AxisName="PointerTriggerLeft",Scale=1.000000,Key=Vive_Left_Trigger_Axis)
+AxisMappings=(AxisName="PointerTriggerLeft",Scale=1.000000,Key=ValveIndex_Left_Trigger_Axis)
; The menu button opens and closes the actions list (StarPointer, MenuButtonKey). As with the
; trigger, OpenXR surfaces the button only once it is bound, and the key is device-specific, so
; both devices' menu-equivalent buttons are bound per hand; the pointer polls the candidates.
+ActionMappings=(ActionName="PointerMenu",Key=Vive_Left_Menu_Click)
+ActionMappings=(ActionName="PointerMenu",Key=Vive_Right_Menu_Click)
+ActionMappings=(ActionName="PointerMenu",Key=ValveIndex_Left_B_Click)
+ActionMappings=(ActionName="PointerMenu",Key=ValveIndex_Right_B_Click)
; With the actions list open, the trackpad (Vive) or thumbstick (Index) scrolls a highlight up and
; down the items, and its click runs the highlighted one (StarPointer, MenuScrollKey / MenuSelectKey).
; As with the trigger, OpenXR surfaces these only once bound, and the keys are device-specific, so
; both devices' and both hands' axes and clicks are bound; the pointer polls the candidates.
+AxisMappings=(AxisName="PointerMenuScroll",Scale=1.000000,Key=Vive_Left_Trackpad_Y)
+AxisMappings=(AxisName="PointerMenuScroll",Scale=1.000000,Key=Vive_Right_Trackpad_Y)
+AxisMappings=(AxisName="PointerMenuScroll",Scale=1.000000,Key=ValveIndex_Left_Thumbstick_Y)
+AxisMappings=(AxisName="PointerMenuScroll",Scale=1.000000,Key=ValveIndex_Right_Thumbstick_Y)
+ActionMappings=(ActionName="PointerMenuSelect",Key=Vive_Left_Trackpad_Click)
+ActionMappings=(ActionName="PointerMenuSelect",Key=Vive_Right_Trackpad_Click)
+ActionMappings=(ActionName="PointerMenuSelect",Key=ValveIndex_Left_Thumbstick_Click)
+ActionMappings=(ActionName="PointerMenuSelect",Key=ValveIndex_Right_Thumbstick_Click)
