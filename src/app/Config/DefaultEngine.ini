[/Script/EngineSettings.GameMapsSettings]
; No map of our own: the empty engine map, and the game mode builds the scene.
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/StellarSpike.StellarSpikeGameMode

[/Script/Engine.RendererSettings]
; Brightness comes from the stars' magnitudes, so the camera must not adapt to it.
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
; Forward shading with MSAA, as the headsets need; instanced stereo and multiview draw both eyes in one pass.
r.ForwardShading=True
r.AntiAliasingMethod=3
r.MSAACount=4
vr.InstancedStereo=True
vr.MobileMultiView=True

[/Script/MacTargetPlatform.XcodeProjectSettings]
; The signing team is per developer: put CodeSigningTeam=<Team ID> in Config/UserEngine.ini (git-ignored).
CodeSigningPrefix=io.github.peterlharding
bUseAutomaticCodeSigning=True
; A packaged Mac build listens for spoken commands: Build/Mac/Resources/Info.Template.plist
; (the default TemplateMacPlist) says why it wants the microphone and speech recognition,
; and these entitlements allow audio input. They leave out the engine's default app sandbox,
; in which SQLite cannot open the catalogue staged in the app; a personal tool not sold
; through the App Store has no need of one (ADR 0009).
PremadeMacEntitlements=(FilePath="/Game/Build/Mac/Resources/StellarSpike.entitlements")

[/Script/Engine.Engine]
bSmoothFrameRate=False
; The camera's near plane, 1 cm in Unreal units and 0.01 pc at 100 units to the parsec (the
; engine's 10 would be 0.1 pc): nearer than this a star is not drawn, so "closer" stops at
; twice it. The panel, a metre away in a headset, is far beyond it.
NearClipPlane=1.0

[/Script/MacRuntimeSettings.MacRuntimeSettings]
; The Mac app's bundle version (CFBundleShortVersionString), kept in step with VERSION by
; scripts/version.py; without it the bundle takes the engine's version.
VersionInfo=0.5.0

[/Script/IOSRuntimeSettings.IOSRuntimeSettings]
; The visionOS app's bundle version, kept in step with VERSION by scripts/version.py.
VersionInfo=0.5.0
; The OpenXR runtime on visionOS starts an ARKit session for head and hand tracking,
; voice commands use the microphone and speech recognition, and the control service the
; local network; visionOS ends an app that asks for any of these without saying why. Info.plist is
; generated from the IOS config hierarchy, so this cannot live in Config/VisionOS.
AdditionalPlistData=<key>NSBonjourServices</key><array><string>_stellar._tcp</string></array><key>NSLocalNetworkUsageDescription</key><string>Stellar Explorer lets a desktop console on your network follow and steer it.</string><key>NSMicrophoneUsageDescription</key><string>Stellar Explorer listens for spoken commands, such as "Go to Sirius".</string><key>NSSpeechRecognitionUsageDescription</key><string>Stellar Explorer recognises spoken commands on the headset, such as "Go to Sirius".</string><key>NSWorldSensingUsageDescription</key><string>Stellar Explorer keeps the stars fixed around you as you move.</string><key>NSHandsTrackingUsageDescription</key><string>Stellar Explorer lets you reach out and select stars with your hands.</string>

[/Script/VisionOSRuntimeSettings.VisionOSRuntimeSettings]
; Hide the viewer's hands and arms in full immersion (0 hidden, 1 visible, 2 automatic);
; the app is to have a pointer of its own.
UpperLimbVisibility=0
