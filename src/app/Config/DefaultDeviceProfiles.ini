[VisionPro DeviceProfile]
; BaseDeviceProfiles.ini sets mode 2, which makes the headset's depth swapchain
; the multisampled scene depth. The 5.8 OpenXR plugin always allocates that
; swapchain at one sample, so with MSAA on, the first frame fails a check in
; FOpenXRHMD::AllocateDepthTexture. Mode 0 resolves the scene depth into it.
+CVars=r.Mobile.XRMSAAMode=0
