[/Script/EngineSettings.GameMapsSettings]
; No map of our own: the empty engine map, and the game mode builds the scene.
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/StellarSpike.StellarSpikeGameMode

[/Script/Engine.RendererSettings]
; Brightness comes from the stars' magnitudes, so the camera must not adapt to it.
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
; Forward shading with MSAA, as the headsets need; instanced stereo and multiview draw both eyes in one pass.
r.ForwardShading=True
r.AntiAliasingMethod=3
r.MSAACount=4
vr.InstancedStereo=True
vr.MobileMultiView=True

[/Script/MacTargetPlatform.XcodeProjectSettings]
; The signing team is per developer: put CodeSigningTeam=<Team ID> in Config/UserEngine.ini (git-ignored).
CodeSigningPrefix=io.github.peterlharding
bUseAutomaticCodeSigning=True

[/Script/Engine.Engine]
bSmoothFrameRate=False

[/Script/IOSRuntimeSettings.IOSRuntimeSettings]
; The OpenXR runtime on visionOS starts an ARKit session for head and hand tracking,
; and visionOS ends an app that asks for it without saying why. Info.plist is
; generated from the IOS config hierarchy, so this cannot live in Config/VisionOS.
AdditionalPlistData=<key>NSWorldSensingUsageDescription</key><string>Stellar Explorer keeps the stars fixed around you as you move.</string><key>NSHandsTrackingUsageDescription</key><string>Stellar Explorer lets you reach out and select stars with your hands.</string>
