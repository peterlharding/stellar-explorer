[/Script/OpenXRHMD.OpenXRHMDSettings]
; The HTC VIVE OpenXR runtime supports only OpenXR 1.0. With 1.1 enabled Unreal requests it and
; xrCreateInstance fails ("invalid API version 1.1. Max supported version is 1.0"), so the headset
; never starts and the app falls back to a flat window. Disabling 1.1 makes Unreal request 1.0,
; which the runtime accepts; 1.0 stays enabled. Windows-only, so the Vision Pro build is unaffected.
bIsOpenXR1_1Enabled=False
